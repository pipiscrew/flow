name: Build site on schedule or main branch update

on:
  push:
    branches:
      - main
  schedule:
    # Adjust refresh schedule here. By default, it runs once per day.
    # Syntax reference: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#schedule
    # Recommended tool: https://crontab.guru/
    - cron: "0 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.4
        with:
          node-version: "16"
      - name: Install dependencies
        run: npm i
      - name: Build the feed
        run: npm run build
      - name: Checkout gh-pages Branch
        run: |
          git fetch origin gh-pages:gh-pages  # Fetch the gh-pages branch
          git checkout gh-pages  # Checkout to the gh-pages branch
      - name: Copy Files from Main
        run: |
          git checkout main -- index2.html index2style.css  # Checkout files from main branch
      - name: Commit and Push to gh-pages
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@example.com'
          git add index2.html index2style.css
          git commit -m "Copy files from main to gh-pages"
          git push origin gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public





